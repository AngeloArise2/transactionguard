<div class="page">
  <div class="header">
    <h1>New transaction</h1>
    <a class="btn btn-ghost" routerLink="/transactions">← Back to list</a>
  </div>

  @if (error()) {
    <div class="alert alert-error">{{ error() }}</div>
  }

  <form class="card" [formGroup]="form" (ngSubmit)="onSubmit()">
    <label for="customerId">Customer</label>
    <select id="customerId" formControlName="customerId">
      @for (customer of customers(); track customer.id) {
        <option [ngValue]="customer.id">{{ customer.name }} — {{ customer.email }}</option>
      }
    </select>

    <label for="amount">Amount ($)</label>
    <input id="amount" type="number" step="0.01" min="0.01" formControlName="amount" />

    <label for="merchant">Merchant</label>
    <input id="merchant" type="text" formControlName="merchant" />

    <label for="category">Category</label>
    <input id="category" type="text" formControlName="category" placeholder="e.g. Groceries (optional)" />

    <button type="submit" [disabled]="form.invalid">Create transaction</button>
  </form>
</div>
