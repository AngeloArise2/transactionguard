services:
  postgres:
    image: postgres:15
    container_name: transactionguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-transactionguard}
      POSTGRES_USER: ${POSTGRES_USER:-tg_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tg_pass}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - tg_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tg_user} -d ${POSTGRES_DB:-transactionguard}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: transactionguard-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  tg_postgres_data: