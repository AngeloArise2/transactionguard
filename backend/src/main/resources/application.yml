spring:
  application:
    name: transactionguard
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5432}/${POSTGRES_DB:transactionguard}
    username: ${POSTGRES_USER:tg_user}
    password: ${POSTGRES_PASSWORD:tg_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:change-this-in-.env-never-commit-a-real-secret}
    expiration-ms: 86400000
  anomaly:
    threshold-multiplier: 3.0
    ema-alpha: 0.3
  generator:
    interval-ms: 5000

logging:
  level:
    org.springframework.security: INFO
    com.transactionguard: DEBUG
